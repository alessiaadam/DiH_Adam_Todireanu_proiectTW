<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/auth.css">
    <title>Înregistrare - Ierbar Virtual</title>

</head>

<body>

    <div class="form-container">
        <h2>Creează un cont</h2>
        <form>
            <label for="username">Nume utilizator:</label>
            <input type="text" id="username" name="username" required>

            <label for="email">Adresă de Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Parolă:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Înregistrează-te</button>
        </form>
    </div>

    <script>
        // adaugam un event listener pentru submit pe formularul de inregistrare
        document.querySelector('form').addEventListener('submit', function (e) {
            // prevenim comportamentul default al formularului (reincarcarea paginii)
            e.preventDefault();

            // extragem datele din formular folosind FormData
            const formData = new FormData(this);

            fetch('api/register_action.php', {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Eroare de rețea sau de server.');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'success') {
                        // daca inregistrarea a fost reusita, afisam mesajul de succes si redirectionam utilizatorul catre pagina de login
                        alert(data.message);
                        window.location.href = 'login.html';
                    } else {
                        // afisam mesajul de eroare returnat de server
                        alert(data.message);
                    }
                })
                .catch(error => {
                    console.error('Eroare Fetch:', error);
                    alert('A apărut o problemă la comunicarea cu serverul.');
                });
        });
    </script>

</body>

</html>
