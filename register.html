<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <title>Înregistrare - Ierbar Virtual</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 50px;
        }

        .form-container {
            max-width: 300px;
            margin: auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>Creează un cont</h2>
        <form action="api/register_action.php" method="POST">
            <label for="username">Nume utilizator:</label>
            <input type="text" id="username" name="username" required>

            <label for="email">Adresă de Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Parolă:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Înregistrează-te</button>
        </form>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = new FormData(this);

            fetch('api/register_action.php', {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Eroare de rețea sau de server.');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'success') {
                        alert(data.message);
                        window.location.href = 'login.html';
                    } else {
                        alert(data.message);
                    }
                })
                .catch(error => {
                    console.error('Eroare Fetch:', error);
                    alert('A apărut o problemă la comunicarea cu serverul.');
                });
        });
    </script>

</body>

</html>
