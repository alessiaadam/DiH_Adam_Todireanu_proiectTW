<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ierbar Virtual</title>
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>
    <div class="form-container">
        <h2>Login</h2>
        <form>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>

            <button type="submit">Login</button>
        </form>
        <p>Nu ai un cont? <a href="register.html">Înregistrează-te aici</a>.</p>

        <script>
            // adaugam un event listener pentru submit pe formularul de login
            document.querySelector('form').addEventListener('submit', function (e) {
                // prevenim comportamentul default al formularului (reincarcarea paginii)
                e.preventDefault();

                const formData = new FormData(this);

                fetch('api/login_action.php', {
                    method: 'POST',
                    body: formData
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Eroare de comunicație cu serverul.');
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.status === 'success') {
                            // daca login-ul a fost reusit, redirectionam utilizatorul catre dashboard
                            window.location.href = 'dashboard.php';
                        } else {
                            // afisam mesajul de eroare returnat de server
                            alert(data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Eroare:', error);
                        alert('A apărut o problemă la autentificare. Încearcă din nou.');
                    });
            });
        </script>
</body>

</html>
